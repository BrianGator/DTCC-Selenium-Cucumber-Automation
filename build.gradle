plugins {
    id 'java'
}

group = 'com.dtcc.automation'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation 'com.codeborne:selenide:7.3.0'
    implementation 'org.seleniumhq.selenium:selenium-java:4.21.0'
    implementation 'org.testng:testng:7.10.2'
    implementation 'io.cucumber:cucumber-java:7.18.0'
    implementation 'io.cucumber:cucumber-testng:7.18.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.rest-assured:json-schema-validator:5.4.0'
    testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
    testImplementation 'org.wiremock:wiremock:3.6.0'
    implementation 'com.h2database:h2:2.2.224'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
}

test {
    useTestNG() {
        suites 'src/test/resources/testng-suites/all-suites.xml'
    }
}

// Allure TestNG reporting adapter used by GitHub Actions / GitHub Pages dashboards.
dependencies {
    testImplementation 'io.qameta.allure:allure-testng:2.13.9'
}
