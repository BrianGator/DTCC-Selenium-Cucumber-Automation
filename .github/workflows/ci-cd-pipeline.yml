name: DTCC Enterprise Test Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Stable suite to execute'
        required: true
        default: 'allure-ui'
        type: choice
        options:
          - allure-ui
          - api
          - selenide
          - public-site

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Resolve suite
        id: suite
        shell: bash
        run: |
          SUITE="${{ github.event.inputs.suite }}"
          if [ -z "$SUITE" ]; then SUITE="allure-ui"; fi
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"

      - name: Compile framework
        run: mvn -B -q clean compile test-compile -DskipTests

      - name: Run selected stable suite
        run: |
          mvn -B test -P${{ steps.suite.outputs.suite }} \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=qa \
            -DincludeIntentionalFailures=false \
            -Dallure.results.directory=target/allure-results

      - name: Generate Allure report
        if: always()
        run: |
          mvn -B allure:report -Dallure.results.directory=target/allure-results
          bash scripts/build-report-dashboard.sh target/report-dashboard target/site/allure-report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtcc-automation-reports
          path: |
            target/surefire-reports/**
            target/cucumber-reports/**
            target/allure-results/**
            target/failed-test-screenshots/**
            target/site/allure-report/**
            target/report-dashboard/**
          if-no-files-found: warn
