name: Selenium CI/CD Pipeline with Allure Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Maven profile to run'
        required: true
        default: 'allure-ui'
        type: choice
        options:
          - allure-ui
          - ui
          - selenide
          - api
          - testcases
          - expanded
          - public-site
          - failure-demo
      include_intentional_failures:
        description: 'Generate example failing tests for report demonstration'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  checks: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-report:
    name: Run automation tests and publish Allure report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Browser and Java Versions
        run: |
          java -version
          mvn -version
          google-chrome --version || chrome --version

      - name: Resolve Maven Profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.test_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="allure-ui"; fi
          INCLUDE_FAILURES="${{ github.event.inputs.include_intentional_failures }}"
          if [ -z "$INCLUDE_FAILURES" ]; then INCLUDE_FAILURES="false"; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "include_failures=$INCLUDE_FAILURES" >> "$GITHUB_OUTPUT"

      - name: Restore Previous Allure History
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p target/allure-results/history target/previous-allure-history
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git --work-tree=target/previous-allure-history checkout origin/gh-pages -- allure/history || true
            if [ -d target/previous-allure-history/allure/history ]; then
              cp -R target/previous-allure-history/allure/history/. target/allure-results/history/ || true
            fi
          fi

      - name: Seed Allure History When No Prior Trend Exists
        if: always()
        shell: bash
        run: |
          mkdir -p target/allure-results/history
          if [ ! -f target/allure-results/history/history-trend.json ]; then
            cat > target/allure-results/history/history-trend.json <<'EOF'
          [
            {"buildOrder":1,"reportName":"Seed Run 1","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"total":42,"passed":34,"failed":3,"broken":1,"skipped":4,"unknown":0}},
            {"buildOrder":2,"reportName":"Seed Run 2","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"total":57,"passed":49,"failed":2,"broken":0,"skipped":6,"unknown":0}},
            {"buildOrder":3,"reportName":"Seed Run 3","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"total":82,"passed":71,"failed":3,"broken":0,"skipped":8,"unknown":0}}
          ]
          EOF
          fi
          if [ ! -f target/allure-results/history/categories-trend.json ]; then
            cat > target/allure-results/history/categories-trend.json <<'EOF'
          [
            {"buildOrder":1,"reportName":"Seed Run 1","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"Intentional demo failures":2,"Security validation failures":1,"REST API contract failures":1}},
            {"buildOrder":2,"reportName":"Seed Run 2","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"Intentional demo failures":2,"Security validation failures":0,"REST API contract failures":0}},
            {"buildOrder":3,"reportName":"Seed Run 3","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"Intentional demo failures":3,"Security validation failures":0,"REST API contract failures":0}}
          ]
          EOF
          fi
          if [ ! -f target/allure-results/history/duration-trend.json ]; then
            cat > target/allure-results/history/duration-trend.json <<'EOF'
          [
            {"buildOrder":1,"reportName":"Seed Run 1","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"duration":35000}},
            {"buildOrder":2,"reportName":"Seed Run 2","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"duration":42000}},
            {"buildOrder":3,"reportName":"Seed Run 3","reportUrl":"https://briangator.github.io/DTCC-Selenium-Cucumber-Automation/allure/index.html","data":{"duration":51000}}
          ]
          EOF
          fi

      - name: Run Selenium API Database Tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p target/allure-results target/surefire-reports target/failed-test-screenshots
          mvn -B clean test -P${{ steps.profile.outputs.profile }} \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=qa \
            -Dallure.results.directory=target/allure-results \
            -DincludeIntentionalFailures=${{ steps.profile.outputs.include_failures }}

      - name: Prepare Allure Report Metadata
        if: always()
        shell: bash
        run: |
          mkdir -p target/allure-results
          cat > target/allure-results/environment.properties <<EOF
          Repository=https://github.com/BrianGator/DTCC-Selenium-Cucumber-Automation/
          Website=https://www.dtcc.com/
          Browser=Chrome Headless
          Test_Profile=${{ steps.profile.outputs.profile }}
          Intentional_Failures=${{ steps.profile.outputs.include_failures }}
          Public_Safe_Mode=true
          Data_Source=Mock UI, WireMock REST API, H2 database
          Owner=Brian McCarthy
          EOF
          cat > target/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/index.html"
          }
          EOF
          cat > target/allure-results/categories.json <<'EOF'
          [
            {"name":"Intentional demo failures","matchedStatuses":["failed"],"messageRegex":".*Intentional.*"},
            {"name":"Security validation failures","matchedStatuses":["failed","broken"],"traceRegex":".*(script|SQL|unauthorized|Bearer|security).*"},
            {"name":"REST API contract failures","matchedStatuses":["failed","broken"],"traceRegex":".*(RestAssured|WireMock|statusCode|JSON|schema).*"},
            {"name":"Browser UI failures","matchedStatuses":["failed","broken"],"traceRegex":".*(Selenium|WebDriver|Chrome|NoSuchElement|Timeout).*"},
            {"name":"Skipped opt-in demos","matchedStatuses":["skipped"],"messageRegex":".*Intentional failure demo skipped.*"}
          ]
          EOF

      - name: Generate Allure HTML Report
        if: always()
        run: |
          mkdir -p target/allure-results
          mvn -B allure:report -Dallure.results.directory=target/allure-results
          test -f target/site/allure-report/index.html || (echo "Allure report was not generated" && exit 1)

      - name: Generate Cucumber BDD Report
        id: cucumber
        if: always()
        continue-on-error: true
        run: |
          mkdir -p target/cucumber-reports
          mvn -B test -Pui \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=qa \
            -DincludeIntentionalFailures=false
          test -f target/cucumber-reports/cucumber-pretty.html || (echo "Cucumber HTML report was not generated" && exit 1)
          test -f target/cucumber-reports/CucumberTestReport.json || (echo "Cucumber JSON report was not generated" && exit 1)

      - name: Build GitHub Pages Report Portal
        if: always()
        shell: bash
        run: |
          bash scripts/build-report-portal.sh target/report-portal
          test -f target/report-portal/index.html || (echo "Report portal was not generated" && exit 1)

      - name: Generate PDF Reports
        if: always()
        shell: bash
        run: |
          bash scripts/generate-report-pdfs.sh target/report-portal target/report-portal/reports
          test -f target/report-portal/reports/Allure-Test-Report-6-3-2026.pdf || (echo "Allure PDF was not generated" && exit 1)

      - name: Upload Raw Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/cucumber-reports/**
            target/failed-test-screenshots/**
          if-no-files-found: warn

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/site/allure-report
          if-no-files-found: error

      - name: Upload PDF Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reports
          path: target/report-portal/reports/**
          if-no-files-found: error

      - name: Upload Report Portal Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-report-portal
          path: target/report-portal
          if-no-files-found: error

      - name: Check GitHub Pages Configuration
        id: pages
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled for this repository."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "## GitHub Pages is not enabled yet" >> "$GITHUB_STEP_SUMMARY"
            echo "The report portal artifact was generated successfully. Publish source should be gh-pages / root after Pages is enabled." >> "$GITHUB_STEP_SUMMARY"
            echo "API status: $status" >> "$GITHUB_STEP_SUMMARY"
            cat pages.json || true
          fi

      - name: Prefer gh-pages Branch as Pages Source
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o update-pages-source.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          if [ "$status" = "204" ]; then
            echo "GitHub Pages source set to gh-pages / root." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub Pages source update returned HTTP $status. The gh-pages branch will still be updated with the report portal." >> "$GITHUB_STEP_SUMMARY"
            cat update-pages-source.json || true
          fi

      - name: Publish Report Portal to gh-pages Branch
        if: always() && github.event_name != 'pull_request' && steps.tests.outcome != 'failure' && steps.cucumber.outcome != 'failure'
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R target/report-portal/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout --detach origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$publish_dir/." .
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages report changes to publish."
          else
            git commit -m "Publish latest test report portal with PDFs"
            git push origin HEAD:gh-pages
          fi

      - name: Add Summary Link
        if: always()
        run: |
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "## Selenium TestNG Allure Execution" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ steps.profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "Intentional failures: ${{ steps.profile.outputs.include_failures }}" >> $GITHUB_STEP_SUMMARY
          echo "Raw test artifacts, Allure HTML, Cucumber BDD, PDF reports, and the report portal are attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "Report portal: ${pages_url}" >> $GITHUB_STEP_SUMMARY
          echo "Live Allure report: ${pages_url}allure/index.html" >> $GITHUB_STEP_SUMMARY
          echo "PDF reports: ${pages_url}reports/index.html" >> $GITHUB_STEP_SUMMARY
          echo "Cucumber BDD report: ${pages_url}cucumber/index.html" >> $GITHUB_STEP_SUMMARY
          echo "Static dashboard: ${pages_url}dashboard/index.html" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pages.outputs.enabled }}" != "true" ]; then
            echo "If the public URL still returns 404, enable Settings > Pages > Source: Deploy from a branch > gh-pages / root." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail Workflow When Stable Tests Failed
        if: always() && steps.tests.outcome == 'failure' && steps.profile.outputs.include_failures != 'true'
        run: |
          echo "Stable test run failed. Reports were generated and uploaded for review."
          exit 1

      - name: Fail Workflow When Cucumber BDD Tests Failed
        if: always() && steps.cucumber.outcome == 'failure'
        run: |
          echo "Cucumber BDD test run failed. Reports were generated and uploaded for review."
          exit 1
