name: Selenium CI/CD Pipeline with Allure Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Maven profile to run'
        required: true
        default: 'allure-ui'
        type: choice
        options:
          - allure-ui
          - ui
          - selenide
          - api
          - testcases
          - expanded
          - public-site
          - failure-demo
      include_intentional_failures:
        description: 'Generate example failing tests for report demonstration'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  checks: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-report:
    name: Run automation tests and publish report dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Browser and Java Versions
        run: |
          java -version
          mvn -version
          google-chrome --version || chrome --version

      - name: Resolve Maven Profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.test_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="allure-ui"; fi
          INCLUDE_FAILURES="${{ github.event.inputs.include_intentional_failures }}"
          if [ -z "$INCLUDE_FAILURES" ]; then INCLUDE_FAILURES="false"; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "include_failures=$INCLUDE_FAILURES" >> "$GITHUB_OUTPUT"

      - name: Run Stable TestNG Allure Suite
        id: tests
        continue-on-error: true
        run: |
          mkdir -p target/allure-results target/surefire-reports target/failed-test-screenshots
          mvn -B clean test -P${{ steps.profile.outputs.profile }} \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=qa \
            -Dallure.results.directory=target/allure-results \
            -DincludeIntentionalFailures=${{ steps.profile.outputs.include_failures }}

      - name: Generate Allure HTML Report
        if: always()
        run: |
          mkdir -p target/allure-results
          mvn -B allure:report -Dallure.results.directory=target/allure-results
          test -f target/site/allure-report/index.html || (echo "Allure report was not generated" && exit 1)

      - name: Build Report Dashboard
        if: always()
        run: |
          bash scripts/build-report-dashboard.sh target/report-dashboard target/site/allure-report
          test -f target/report-dashboard/index.html || (echo "Report dashboard was not generated" && exit 1)

      - name: Upload Raw Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/failed-test-screenshots/**
            target/report-dashboard/**
          if-no-files-found: warn

      - name: Upload Report Dashboard Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report-dashboard
          path: target/report-dashboard
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Report Dashboard to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/report-dashboard

      - name: Deploy Allure Report to GitHub Pages
        id: deployment
        if: always() && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

      - name: Add Summary Link
        if: always()
        run: |
          echo "## Selenium TestNG Allure Execution" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ steps.profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "Intentional failures: ${{ steps.profile.outputs.include_failures }}" >> $GITHUB_STEP_SUMMARY
          echo "Raw test artifacts, Allure HTML, and the report dashboard are attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "Published report dashboard URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "Allure report path: ${{ steps.deployment.outputs.page_url }}allure-report/index.html" >> $GITHUB_STEP_SUMMARY

      - name: Fail Workflow When Stable Tests Failed
        if: always() && steps.tests.outcome == 'failure' && steps.profile.outputs.include_failures != 'true'
        run: |
          echo "Stable test run failed. Reports were generated and uploaded for review."
          exit 1
