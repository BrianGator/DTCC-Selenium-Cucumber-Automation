name: Selenium CI/CD Pipeline with Allure Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Maven profile to run'
        required: true
        default: 'allure-ui'
        type: choice
        options:
          - allure-ui
          - ui
          - selenide
          - api
          - testcases
          - expanded
          - public-site
          - failure-demo
      include_intentional_failures:
        description: 'Generate example failing tests for report demonstration'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  checks: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-report:
    name: Run automation tests and publish Allure report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Browser and Java Versions
        run: |
          java -version
          mvn -version
          google-chrome --version || chrome --version

      - name: Resolve Maven Profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.test_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="allure-ui"; fi
          INCLUDE_FAILURES="${{ github.event.inputs.include_intentional_failures }}"
          if [ -z "$INCLUDE_FAILURES" ]; then INCLUDE_FAILURES="false"; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "include_failures=$INCLUDE_FAILURES" >> "$GITHUB_OUTPUT"

      - name: Run Selenium API Database Tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p target/allure-results target/surefire-reports target/failed-test-screenshots
          mvn -B clean test -P${{ steps.profile.outputs.profile }} \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=qa \
            -Dallure.results.directory=target/allure-results \
            -DincludeIntentionalFailures=${{ steps.profile.outputs.include_failures }}

      - name: Generate Allure HTML Report
        if: always()
        run: |
          mkdir -p target/allure-results
          mvn -B allure:report -Dallure.results.directory=target/allure-results
          test -f target/site/allure-report/index.html || (echo "Allure report was not generated" && exit 1)

      - name: Build GitHub Pages Report Portal
        if: always()
        shell: bash
        run: |
          rm -rf target/report-portal
          mkdir -p target/report-portal/allure target/report-portal/dashboard target/report-portal/sample-reports target/report-portal/surefire
          cp -R target/site/allure-report/. target/report-portal/allure/ || true
          cp -R 13_Reports/web-ui/. target/report-portal/dashboard/ || true
          cp -R 13_Reports/allure-sample-results/. target/report-portal/sample-reports/ || true
          cp -R target/surefire-reports/. target/report-portal/surefire/ || true
          cat > target/report-portal/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>DTCC Selenium Cucumber Automation - Test Report Portal</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; color: #172033; }
              header { background: #0f172a; color: white; padding: 32px; }
              main { padding: 28px 32px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
              .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); border: 1px solid #e5e7eb; }
              .card h2 { margin-top: 0; }
              a.button { display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 11px 14px; border-radius: 8px; margin: 6px 6px 6px 0; }
              a.secondary { background: #374151; }
              code { background: #e5e7eb; padding: 2px 5px; border-radius: 4px; }
              .note { background: #fff7ed; border-left: 5px solid #f59e0b; padding: 12px 16px; margin: 20px 0; }
            </style>
          </head>
          <body>
            <header>
              <h1>DTCC Selenium Cucumber Automation - Test Report Portal</h1>
              <p>Repository: BrianGator/DTCC-Selenium-Cucumber-Automation</p>
              <p>Website Under Test: https://www.dtcc.com/</p>
            </header>
            <main>
              <div class="note">
                <strong>Run tests from GitHub UI:</strong> Use the Actions workflow page. GitHub Pages is static, so it cannot securely start workflows by itself without a GitHub token.
              </div>
              <section class="grid">
                <div class="card">
                  <h2>Live Allure Report</h2>
                  <p>Interactive report generated from the latest GitHub Actions run.</p>
                  <a class="button" href="allure/index.html">Open Live Allure Report</a>
                </div>
                <div class="card">
                  <h2>Portfolio Dashboard</h2>
                  <p>Static dashboard with pass/fail summary, links, and example report views.</p>
                  <a class="button" href="dashboard/index.html">Open Dashboard</a>
                </div>
                <div class="card">
                  <h2>Sample Allure Reports</h2>
                  <p>Static passed/failed report examples for GitHub review.</p>
                  <a class="button" href="sample-reports/index.html">Sample Allure</a>
                  <a class="button secondary" href="sample-reports/passed-report.html">Passed</a>
                  <a class="button secondary" href="sample-reports/failed-report.html">Failed</a>
                </div>
                <div class="card">
                  <h2>Surefire Reports</h2>
                  <p>Raw Maven Surefire/TestNG output from the workflow run.</p>
                  <a class="button" href="surefire/">Open Surefire Folder</a>
                  <a class="button secondary" href="sample-reports/surefire-report.html">Sample Surefire HTML</a>
                </div>
                <div class="card">
                  <h2>Run Tests in GitHub Actions</h2>
                  <p>Use the workflow dispatch UI to choose <code>allure-ui</code>, <code>selenide</code>, <code>api</code>, <code>public-site</code>, or failure demo.</p>
                  <a class="button" href="https://github.com/BrianGator/DTCC-Selenium-Cucumber-Automation/actions/workflows/selenium.yml">Open Run Workflow UI</a>
                  <a class="button secondary" href="https://github.com/BrianGator/DTCC-Selenium-Cucumber-Automation/actions">All Actions</a>
                </div>
                <div class="card">
                  <h2>Repository</h2>
                  <p>Source code, Maven profiles, TestNG suites, Selenium/Selenide tests, API tests, SQL checks, and reports.</p>
                  <a class="button" href="https://github.com/BrianGator/DTCC-Selenium-Cucumber-Automation/">Open Repository</a>
                </div>
              </section>
            </main>
          </body>
          </html>
          HTML

      - name: Upload Raw Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/failed-test-screenshots/**
          if-no-files-found: warn

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/site/allure-report
          if-no-files-found: error

      - name: Upload Report Portal Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-report-portal
          path: target/report-portal
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Report Portal to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/report-portal

      - name: Deploy Report Portal to GitHub Pages
        id: deployment
        if: always() && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

      - name: Add Summary Link
        if: always()
        run: |
          echo "## Selenium TestNG Allure Execution" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ steps.profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "Intentional failures: ${{ steps.profile.outputs.include_failures }}" >> $GITHUB_STEP_SUMMARY
          echo "Report portal: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "Live Allure report: ${{ steps.deployment.outputs.page_url }}allure/index.html" >> $GITHUB_STEP_SUMMARY
          echo "Static dashboard: ${{ steps.deployment.outputs.page_url }}dashboard/index.html" >> $GITHUB_STEP_SUMMARY
          echo "Sample reports: ${{ steps.deployment.outputs.page_url }}sample-reports/index.html" >> $GITHUB_STEP_SUMMARY
