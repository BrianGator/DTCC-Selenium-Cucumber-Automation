name: Selenium CI/CD Pipeline with Allure Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Maven profile to run'
        required: true
        default: 'allure-ui'
        type: choice
        options:
          - allure-ui
          - ui
          - selenide
          - api
          - testcases
          - expanded
          - public-site
          - failure-demo
      include_intentional_failures:
        description: 'Generate example failing tests for report demonstration'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  checks: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-report:
    name: Run automation tests and publish Allure report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Browser and Java Versions
        run: |
          java -version
          mvn -version
          google-chrome --version || chrome --version

      - name: Resolve Maven Profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.test_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="allure-ui"; fi
          INCLUDE_FAILURES="${{ github.event.inputs.include_intentional_failures }}"
          if [ -z "$INCLUDE_FAILURES" ]; then INCLUDE_FAILURES="false"; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "include_failures=$INCLUDE_FAILURES" >> "$GITHUB_OUTPUT"

      - name: Run Selenium API Database Tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p target/allure-results target/surefire-reports target/failed-test-screenshots
          mvn -B clean test -P${{ steps.profile.outputs.profile }} \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=qa \
            -Dallure.results.directory=target/allure-results \
            -DincludeIntentionalFailures=${{ steps.profile.outputs.include_failures }}

      - name: Generate Allure HTML Report
        if: always()
        run: |
          mkdir -p target/allure-results
          mvn -B allure:report -Dallure.results.directory=target/allure-results
          test -f target/site/allure-report/index.html || (echo "Allure report was not generated" && exit 1)

      - name: Build GitHub Pages Report Portal
        if: always()
        shell: bash
        run: |
          bash scripts/build-report-portal.sh target/report-portal
          test -f target/report-portal/index.html || (echo "Report portal was not generated" && exit 1)

      - name: Upload Raw Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/failed-test-screenshots/**
          if-no-files-found: warn

      - name: Upload Allure HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/site/allure-report
          if-no-files-found: error

      - name: Upload Report Portal Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-report-portal
          path: target/report-portal
          if-no-files-found: error

      - name: Check GitHub Pages Configuration
        id: pages
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled for this repository."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "## GitHub Pages is not enabled yet" >> "$GITHUB_STEP_SUMMARY"
            echo "The report portal artifact was generated successfully, but Pages deployment is skipped until repository Pages is enabled." >> "$GITHUB_STEP_SUMMARY"
            echo "Go to Settings > Pages > Build and deployment > Source, then select GitHub Actions. Run this workflow again after saving." >> "$GITHUB_STEP_SUMMARY"
            echo "API status: $status" >> "$GITHUB_STEP_SUMMARY"
            cat pages.json || true
          fi

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Report Portal to GitHub Pages
        if: always() && github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/report-portal

      - name: Deploy Report Portal to GitHub Pages
        id: deployment
        if: always() && github.event_name != 'pull_request' && steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

      - name: Add Summary Link
        if: always()
        run: |
          echo "## Selenium TestNG Allure Execution" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ steps.profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "Intentional failures: ${{ steps.profile.outputs.include_failures }}" >> $GITHUB_STEP_SUMMARY
          echo "Raw test artifacts, Allure HTML, and the report portal are attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pages.outputs.enabled }}" = "true" ]; then
            echo "Report portal: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
            echo "Live Allure report: ${{ steps.deployment.outputs.page_url }}allure/index.html" >> $GITHUB_STEP_SUMMARY
            echo "Static dashboard: ${{ steps.deployment.outputs.page_url }}dashboard/index.html" >> $GITHUB_STEP_SUMMARY
            echo "Sample reports: ${{ steps.deployment.outputs.page_url }}sample-reports/index.html" >> $GITHUB_STEP_SUMMARY
          else
            echo "Pages URL is not live yet. Download the github-pages-report-portal artifact, or enable Settings > Pages > Source: GitHub Actions and rerun." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail Workflow When Stable Tests Failed
        if: always() && steps.tests.outcome == 'failure' && steps.profile.outputs.include_failures != 'true'
        run: |
          echo "Stable test run failed. Reports were generated and uploaded for review."
          exit 1
