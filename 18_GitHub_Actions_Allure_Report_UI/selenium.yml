name: Selenium CI/CD Pipeline with Allure Reports

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Maven test profile to run'
        required: true
        default: 'expanded'
        type: choice
        options:
          - ui
          - selenide
          - api
          - testcases
          - expanded
          - public-site
          - failure-demo
      include_intentional_failures:
        description: 'Generate example failing tests for report demonstration'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  checks: write

jobs:
  test-and-report:
    name: Run Selenium/TestNG tests and publish Allure UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Browser and Java Versions
        run: |
          java -version
          mvn -version
          google-chrome --version || chrome --version

      - name: Resolve Maven Profile
        id: profile
        shell: bash
        run: |
          PROFILE="${{ github.event.inputs.test_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="expanded"; fi
          INCLUDE_FAILURES="${{ github.event.inputs.include_intentional_failures }}"
          if [ -z "$INCLUDE_FAILURES" ]; then INCLUDE_FAILURES="false"; fi
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "include_failures=$INCLUDE_FAILURES" >> "$GITHUB_OUTPUT"

      - name: Run Selenium / API / Database / Selenide Tests
        run: |
          mvn clean test -P${{ steps.profile.outputs.profile }}             -Dbrowser=chrome             -Dheadless=true             -Denv=qa             -Dallure.results.directory=target/allure-results             -DincludeIntentionalFailures=${{ steps.profile.outputs.include_failures }}
        continue-on-error: true

      - name: Upload Raw Surefire and Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/failed-test-screenshots/**
          if-no-files-found: warn

      - name: Retrieve Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: allure-history-repo

      - name: Generate Allure Report Dashboard
        uses: simple-elf/github-allure-history@v1.1.2
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Report Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Add Summary Link
        if: always()
        run: |
          echo "## Selenium/TestNG/Allure Execution" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ steps.profile.outputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "Intentional failures: ${{ steps.profile.outputs.include_failures }}" >> $GITHUB_STEP_SUMMARY
          echo "Raw test artifacts are attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "After GitHub Pages is enabled, the Allure dashboard publishes from the gh-pages branch." >> $GITHUB_STEP_SUMMARY
